[project]
name = "uestc-deskfriend"
version = "0.1.0"
description = "桌面 AI 伙伴（桌宠）：语音交互 + 屏幕视觉 + LLM 对话"
requires-python = ">=3.10"
dependencies = [
    "pyqt5>=5.15",
    # pyqt5-qt5 5.15.11 起只发 linux/mac wheel，Windows 无法安装；
    # 5.15.2 是唯一带 win_amd64 wheel 的版本（pip 在 Windows 装 PyQt5 也是用它）
    "pyqt5-qt5==5.15.2",
    "qasync>=0.27",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "sounddevice>=0.5",
    "onnxruntime>=1.24.3",
    # AstrBot 后端（OneBot 11 反向 WebSocket 伪装客户端）；>=14 用 extra_headers 传 Bearer token
    "websockets>=14",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
