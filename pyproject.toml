[project]
name = "uestc-deskfriend"
version = "0.1.0"
description = "桌面 AI 伙伴（桌宠）：语音交互 + 屏幕视觉 + LLM 对话"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt5>=5.15",
    # pyqt5-qt5 5.15.11 起只发 linux/mac wheel，Windows 无法安装；
    # 5.15.2 是唯一带 win_amd64 wheel 的版本（pip 在 Windows 装 PyQt5 也是用它）
    "pyqt5-qt5==5.15.2",
    "qasync>=0.27",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "sounddevice>=0.5",
    "onnxruntime>=1.24.3",
    # AstrBot 后端（OneBot 11 反向 WebSocket 伪装客户端）；>=14 用 extra_headers 传 Bearer token
    "websockets>=14",
    "torch>=2.11",
    "torchaudio>=2.11",
    "hyperpyyaml>=1.2.3",
    "modelscope>=1.39.1",
    "x-transformers>=2.25.5",
    "conformer>=0.3.2",
    "transformers>=5.0",
    "librosa>=0.11.0",
    "soundfile>=0.14.0",
    "pyworld>=0.3.5",
    "wetext>=0.1.6",
    "inflect>=7.5.0",
    "omegaconf>=2.3.1",
    "hydra-core>=1.3.5",
    "openai-whisper==20231117",
    "diffusers>=0.39.0",
    "lightning>=2.6.5",
    "einops>=0.8.2",
    "loguru>=0.7.3",
    "typer>=0.27.1",
    "rootutils>=1.0.7",
    "gdown>=6.1.0",
    "rich>=15.0.0",
    "matplotlib>=3.11.1",
    "wget>=3.2",
    "pyarrow>=25.0.1",
    "sherpa-onnx>=1.13.7",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
# 只从该 index 取 torch/torchaudio，其余包一律走 PyPI
# （否则 uv 默认只用第一个含某包的 index，pytorch 上旧版 tqdm 会阻断解析）
include = ["torch", "torchaudio"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# CosyVoice 仓库自带测试文件（runtime/triton_trtllm 等），只收集项目自己的 tests/
testpaths = ["tests"]
