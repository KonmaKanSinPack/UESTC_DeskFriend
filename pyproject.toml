[project]
name = "uestc-deskfriend"
version = "0.1.0"
description = "桌面 AI 伙伴（桌宠）：语音交互 + 屏幕视觉 + LLM 对话"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyqt5>=5.15",
    "qasync>=0.27",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "sounddevice>=0.5",
    "onnxruntime>=1.24.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# win_compat 必须在 PyQt5 之前导入，不能按字母序重排
"main.py" = ["I001"]
"ui.py" = ["I001"]

[tool.uv]
package = false
# PyQt5-Qt5 5.15.2 是最后一个提供 Windows wheel 的版本，新版仅覆盖 Linux/macOS。
constraint-dependencies = ["pyqt5-qt5==5.15.2; sys_platform == 'win32'"]

[tool.pytest.ini_options]
pythonpath = ["."]
